spring:
  application:
    name: argus
  config:
    # Charge les variables du fichier .env s'il existe (clés d'API locales, jamais versionnées).
    import: optional:file:.env[.properties]
  http:
    clients:
      connect-timeout: 10s
      # Sans limite, une réponse bloquée empêcherait toute synchronisation suivante.
      read-timeout: 2m
  jpa:
    hibernate:
      # Flyway crée le schéma. Hibernate vérifie seulement qu'il correspond aux entités.
      ddl-auto: validate
    # Évite de garder la connexion à la base ouverte pendant tout le traitement d'une requête HTTP.
    open-in-view: false
  mvc:
    problemdetails:
      # Renvoie les erreurs au format ProblemDetail (RFC 9457) avec un corps JSON.
      # Sans cette option, une ErrorResponseException ne renvoie que le statut HTTP.
      enabled: true

argus:
  kev:
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  epss:
    url: https://api.first.org/data/v1/epss
  nvd:
    url: https://services.nvd.nist.gov/rest/json/cves/2.0
    api-key: ${NVD_API_KEY}
    # La NVD recommande 6 secondes entre deux requêtes.
    request-delay: 6s
  sync:
    # Valeur par défaut : true. Mettre ARGUS_SYNC_ENABLED=false dans le .env pour la désactiver.
    enabled: ${ARGUS_SYNC_ENABLED:true}
    # Délai avant le premier passage pour laisser l'application finir de démarrer.
    initial-delay: 10s
    interval: 24h
